services:
  limoni-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: limoni-relay
    restart: unless-stopped
    ports:
      - "${PORT:-27850}:${PORT:-27850}/tcp"
      # UDP ses rölesi. Cloudflare Tunnel UDP taşımaz: düşük ping için bu portu
      # VPS / port yönlendirme ile dışarı açın ve RELAY_UDP_PUBLIC_ADDR verin.
      - "${UDP_PORT:-27850}:${UDP_PORT:-27850}/udp"
    environment:
      - PORT=${PORT:-27850}
      - UDP_PORT=${UDP_PORT:-27850}
      # Örn: 203.0.113.10:27850 — istemcilere duyurulan genel UDP adresi.
      # Boşsa WebSocket host adı + UDP_PORT duyurulur (tünel arkasında bu çalışmaz, istemci WebSocket'e düşer).
      - RELAY_UDP_PUBLIC_ADDR=${RELAY_UDP_PUBLIC_ADDR:-}
      - RELAY_AUTH_TOKEN=${RELAY_AUTH_TOKEN:-}
      # Özel ağdan (ör. cloudflared konteyneri) gelen proxy başlıklarına zaten güvenilir;
      # yalnızca röle önünde başka bir genel proxy varsa true yapın.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - LOG_FORMAT=${LOG_FORMAT:-text}

  # 1. Hızlı ve Ücretsiz Tünel (Token veya Cloudflare hesabı GEREKTİRMEZ)
  # Başlatma: docker compose --profile quick-tunnel up -d
  # Adresi Görme: docker logs limoni-quick-tunnel
  quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: limoni-quick-tunnel
    restart: unless-stopped
    profiles: ["quick-tunnel"]
    depends_on:
      - limoni-relay
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: tunnel --no-autoupdate --protocol http2 --url http://limoni-relay:${PORT:-27850}

  # 2. Kalıcı Tünel (Kendi alan adınız ve Cloudflare Token'ınız ile)
  # Başlatma: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: limoni-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - limoni-relay
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
