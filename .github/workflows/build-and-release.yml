name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage zip

      - name: Build Packages
        run: bash scripts/build_packages.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limoni-voice-packages
          path: release_assets/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release_assets
          gh release create "${GITHUB_REF_NAME}" * --title "Limoni Voice ${GITHUB_REF_NAME}" --generate-notes
