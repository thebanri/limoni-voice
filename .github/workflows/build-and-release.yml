name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Vet & Race Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Race tests
        run: go test -mod=vendor -race -count=1 ./...

      - name: Cross-compile check (CGO disabled)
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -mod=vendor -o /dev/null . ./relay-server
          done

  mac-helper:
    name: macOS ScreenCaptureKit Helper
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile universal helper
        run: |
          set -e
          for arch in arm64 x86_64; do
            swiftc -O -target ${arch}-apple-macos12.3 \
              -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreAudio \
              screenshare/mac_capture.swift -o limoni-sck-${arch}
          done
          lipo -create -output limoni-sck limoni-sck-arm64 limoni-sck-x86_64
          codesign --force --sign - limoni-sck
          ./limoni-sck --list || true

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: mac-helper
          path: limoni-sck

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [test, mac-helper]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download macOS helper
        uses: actions/download-artifact@v4
        with:
          name: mac-helper
          path: screenshare/machelper

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg genisoimage zip

      - name: Build Packages
        env:
          # Optional: generate with `go run ./cmd/limoni-sign keygen` and store as repository secrets.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBKEY }}
        run: bash scripts/build_packages.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limoni-voice-packages
          path: release_assets/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release_assets
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists, updating assets..."
            gh release upload "${GITHUB_REF_NAME}" * --clobber
          else
            echo "Creating new release ${GITHUB_REF_NAME}..."
            gh release create "${GITHUB_REF_NAME}" * --title "Limoni Voice ${GITHUB_REF_NAME}" --generate-notes
          fi
