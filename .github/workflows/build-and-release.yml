name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Vet & Race Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod declares the oldest supported Go; releases build with the latest.
          go-version: stable

      - name: Format
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: |
          for goos in linux darwin windows; do
            GOOS=$goos go vet -mod=vendor ./...
          done

      - name: Staticcheck
        # The platform files (CoreAudio, ScreenCaptureKit, Win32, ...) only build for their OS,
        # so each one is checked from here as well.
        run: |
          GOBIN=/tmp/bin go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          for goos in linux darwin windows; do
            GOOS=$goos /tmp/bin/staticcheck ./...
          done

      - name: Race tests
        run: go test -mod=vendor -race -count=1 ./...

      - name: Cross-compile check (CGO disabled)
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -mod=vendor -o /dev/null . ./relay-server
          done

  mac-helper:
    name: macOS ScreenCaptureKit Helper
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile universal helper
        run: |
          set -e
          for arch in arm64 x86_64; do
            swiftc -O -target ${arch}-apple-macos12.3 \
              -framework ScreenCaptureKit -framework CoreMedia -framework CoreVideo -framework CoreAudio \
              screenshare/mac_capture.swift -o limoni-sck-${arch}
          done
          lipo -create -output limoni-sck limoni-sck-arm64 limoni-sck-x86_64
          codesign --force --sign - limoni-sck
          ./limoni-sck --list || true

      - name: Compile universal app launcher
        run: |
          set -e
          for arch in arm64 x86_64; do
            swiftc -O -target ${arch}-apple-macos12 -framework AppKit macos/launcher.swift -o limoni-launcher-${arch}
          done
          lipo -create -output limoni-launcher limoni-launcher-arm64 limoni-launcher-x86_64
          codesign --force --sign - limoni-launcher

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: mac-helper
          path: limoni-sck

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: mac-launcher
          path: limoni-launcher

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [test, mac-helper]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod declares the oldest supported Go; releases build with the latest.
          go-version: stable

      - name: Download macOS helper
        uses: actions/download-artifact@v4
        with:
          name: mac-helper
          path: screenshare/machelper

      - name: Download macOS app launcher
        uses: actions/download-artifact@v4
        with:
          name: mac-launcher
          path: macos/build

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg genisoimage zip

      - name: Install rcodesign (signs the macOS app bundles)
        run: |
          set -e
          v=0.29.0
          f=apple-codesign-${v}-x86_64-unknown-linux-musl
          curl -fsSL -o /tmp/rcodesign.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${v}/${f}.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  /tmp/rcodesign.tgz" | sha256sum -c -
          tar -xzf /tmp/rcodesign.tgz -C /tmp
          sudo install -m 755 /tmp/${f}/rcodesign /usr/local/bin/rcodesign

      - name: Build Packages
        env:
          # Required for tag releases (build_packages.sh refuses to build them unsigned).
          # Generate with `go run ./cmd/limoni-sign keygen` and store as repository secrets.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBKEY }}
          # Optional: a Developer ID certificate and notarization key. Without them the macOS
          # app is signed ad-hoc (users confirm "Open" once instead of seeing it as damaged).
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
          MAC_NOTARY_API_KEY: ${{ secrets.MAC_NOTARY_API_KEY }}
        run: bash scripts/build_packages.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limoni-voice-packages
          path: release_assets/*

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release_assets
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists, updating assets..."
            gh release upload "${GITHUB_REF_NAME}" * --clobber
          else
            echo "Creating new release ${GITHUB_REF_NAME}..."
            gh release create "${GITHUB_REF_NAME}" * --title "Limoni Voice ${GITHUB_REF_NAME}" --generate-notes
          fi

  mac-verify:
    name: Verify macOS App on a Mac
    runs-on: macos-latest
    needs: build

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: limoni-voice-packages
          path: packages

      - name: Check bundle, signature and binary
        run: |
          set -e
          arch=$(uname -m); [ "$arch" = x86_64 ] && arch=amd64
          zip=$(ls packages/Limoni-Voice_*_macOS_${arch}.app.zip)
          ditto -x -k "$zip" app
          bundle="app/Limoni Voice.app"
          plutil -lint "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$bundle/Contents/Info.plist" | grep -qx limoni
          codesign --verify --deep --strict --verbose=2 "$bundle"
          file "$bundle/Contents/MacOS/limoni-voice-launcher" | grep -q Mach-O
          "$bundle/Contents/MacOS/limoni-voice" --version
          "$bundle/Contents/MacOS/limoni-voice" --lang tr --version
          "$bundle/Contents/MacOS/limoni-voice" --help | grep -q -- --lang

