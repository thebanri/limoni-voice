name: CI - Test & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Checkout Limoni Core Library
        uses: actions/checkout@v4
        with:
          repository: thebanri/Limoni
          path: Limoni

      - name: Checkout Limoni Voice
        uses: actions/checkout@v4
        with:
          path: limoni-voice

      - name: Run Tests
        working-directory: limoni-voice
        run: |
          go test -v ./...

      - name: Test Cross-Compilation
        working-directory: limoni-voice
        run: |
          echo "Compiling Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .
          
          echo "Compiling Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .
