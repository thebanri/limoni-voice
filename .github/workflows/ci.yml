name: CI - Test & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Tests
        run: |
          go test -mod=vendor -v ./...

      - name: Test Cross-Compilation
        run: |
          echo "Compiling Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -o /dev/null .
          
          echo "Compiling Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=vendor -o /dev/null .
